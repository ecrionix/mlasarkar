<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MLASarkar</title>
    <meta name="description" content="Login to your MLASarkar account and track MLA performance.">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Login - MLASarkar">
    <meta property="og:description" content="Login to track your MLA's performance.">
    <meta property="og:image" content="https://mlasarkar.in/images/og-image.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563eb;
            --secondary: #1e40af;
            --bg: #ffffff;
            --text: #1f2937;
            --light-bg: #f3f4f6;
            --border: #e5e7eb;
            --error: #dc2626;
            --success: #16a34a;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #111827;
                --text: #f3f4f6;
                --light-bg: #1f2937;
                --border: #374151;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navigation */
        nav {
            background-color: var(--primary);
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav .logo {
            font-size: 1.5rem;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 2rem;
        }

        /* Breadcrumb */
        .breadcrumb {
            background-color: var(--light-bg);
            padding: 0.75rem 2rem;
            font-size: 0.875rem;
            border-bottom: 1px solid var(--border);
        }

        .breadcrumb a {
            color: var(--primary);
            text-decoration: none;
        }

        /* Main Container */
        .container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        /* Form Card */
        .form-card {
            width: 100%;
            max-width: 400px;
            background-color: var(--light-bg);
            padding: 2rem;
            border-radius: 0.75rem;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .form-card h1 {
            font-size: 1.75rem;
            margin-bottom: 0.5rem;
            text-align: center;
        }

        .form-card p {
            text-align: center;
            margin-bottom: 2rem;
            color: #6b7280;
        }

        /* Form Group */
        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text);
        }

        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            font-size: 1rem;
            background-color: var(--bg);
            color: var(--text);
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        /* Button */
        .btn-submit {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn-submit:hover {
            background-color: var(--secondary);
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Message */
        .message {
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1.5rem;
            display: none;
        }

        .message.error {
            background-color: #fee2e2;
            color: var(--error);
            border: 1px solid #fecaca;
            display: block;
        }

        .message.success {
            background-color: #dcfce7;
            color: var(--success);
            border: 1px solid #bbf7d0;
            display: block;
        }

        /* Footer */
        .form-footer {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
        }

        .form-footer p {
            margin-bottom: 0.5rem;
        }

        .form-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        .form-footer a:hover {
            text-decoration: underline;
        }

        /* Loading */
        .loading {
            display: none;
            text-align: center;
            color: var(--primary);
        }

        /* Responsive */
        @media (max-width: 768px) {
            nav {
                padding: 1rem;
            }

            nav .logo {
                font-size: 1.2rem;
            }

            nav a {
                margin-left: 1rem;
                font-size: 0.9rem;
            }

            .container {
                padding: 1rem;
            }

            .form-card {
                padding: 1.5rem;
                max-width: 100%;
            }

            .form-card h1 {
                font-size: 1.5rem;
            }

            input {
                padding: 0.875rem;
                font-size: 16px;
                min-height: 48px;
            }

            .btn-submit {
                padding: 1rem;
                font-size: 1rem;
                min-height: 48px;
            }

            label {
                font-size: 0.95rem;
                margin-bottom: 0.75rem;
            }

            .form-group {
                margin-bottom: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav>
        <div class="logo">🏛️ Track MLA</div>
        <div>
            <a href="index.html">Home</a>
            <a href="signup.html">Sign Up</a>
        </div>
    </nav>

    <!-- Breadcrumb -->
    <div class="breadcrumb">
        <a href="index.html">Home</a> > <span>Login</span>
    </div>

    <!-- Main Container -->
    <div class="container">
        <div class="form-card">
            <h1>Welcome Back</h1>
            <p>Login to your MLASarkar account</p>

            <div id="message" class="message"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address *</label>
                    <input type="email" id="email" name="email" required placeholder="your@email.com">
                </div>

                <div class="form-group">
                    <label for="password">Password *</label>
                    <input type="password" id="password" name="password" required placeholder="Your password">
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">Login</button>
                <div class="loading" id="loading">Logging in...</div>
            </form>

            <div class="form-footer">
                <p>Don't have an account? <a href="signup.html">Sign up here</a></p>
            </div>
        </div>
    </div>

    <script type="module">
        import { signIn } from "./js/auth.js";

        const form = document.getElementById("loginForm");
        const messageDiv = document.getElementById("message");
        const submitBtn = document.getElementById("submitBtn");
        const loading = document.getElementById("loading");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            if (!email || !password) {
                showMessage("Please fill all fields", "error");
                return;
            }

            submitBtn.disabled = true;
            loading.style.display = "block";

            const result = await signIn(email, password);

            if (result.success) {
                showMessage("Login successful! Redirecting to dashboard...", "success");
                setTimeout(() => {
                    window.location.href = "dashboard.html";
                }, 2000);
            } else {
                showMessage(result.message || "Login failed", "error");
                submitBtn.disabled = false;
                loading.style.display = "none";
            }
        });

        function showMessage(text, type) {
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
        }
    </script>
</body>
</html>
