<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick MLA Import - Track MLA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563eb;
            --secondary: #1e40af;
            --success: #16a34a;
            --error: #dc2626;
            --warning: #ea580c;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .container {
            background: white;
            border-radius: 1rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            padding: 3rem;
            text-align: center;
        }

        .header {
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: #6b7280;
            font-size: 1.1rem;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin: 2rem 0;
        }

        .stat-box {
            background: #f3f4f6;
            padding: 1.5rem;
            border-radius: 0.75rem;
            border: 2px solid #e5e7eb;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 0.25rem;
        }

        .stat-label {
            font-size: 0.85rem;
            color: #6b7280;
            text-transform: uppercase;
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 0.5rem;
        }

        .status-pending {
            background-color: var(--warning);
        }

        .status-success {
            background-color: var(--success);
        }

        .progress-section {
            margin: 2rem 0;
        }

        .progress-bar {
            width: 100%;
            height: 40px;
            background-color: #e5e7eb;
            border-radius: 0.5rem;
            overflow: hidden;
            margin-bottom: 1rem;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary) 0%, var(--secondary) 100%);
            width: 0%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            transition: width 0.3s ease;
        }

        .progress-text {
            font-size: 0.9rem;
            color: #6b7280;
        }

        .message {
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
            display: none;
            font-weight: 500;
        }

        .message.success {
            background-color: #dcfce7;
            color: var(--success);
            border: 1px solid #bbf7d0;
            display: block;
        }

        .message.error {
            background-color: #fee2e2;
            color: var(--error);
            border: 1px solid #fecaca;
            display: block;
        }

        .message.info {
            background-color: #dbeafe;
            color: var(--primary);
            border: 1px solid #bfdbfe;
            display: block;
        }

        button {
            padding: 1rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            width: 100%;
        }

        .btn-primary:hover:not(:disabled) {
            background-color: var(--secondary);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .details {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid #e5e7eb;
            text-align: left;
        }

        .detail-item {
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }

        .detail-label {
            color: #6b7280;
            font-weight: 500;
        }

        .detail-value {
            color: var(--primary);
            font-weight: 600;
        }

        .success-animation {
            animation: pulse 1s ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(37, 99, 235, 0.3);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 0.5rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .results {
            display: none;
            margin-top: 2rem;
        }

        .result-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 1rem;
        }

        .result-card {
            background: #f3f4f6;
            padding: 1.5rem;
            border-radius: 0.75rem;
        }

        .result-number {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--primary);
        }

        .result-text {
            color: #6b7280;
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏛️ Track MLA</h1>
            <p>Bulk Import 234 Tamil Nadu MLAs</p>
        </div>

        <div id="message" class="message"></div>

        <div class="stats">
            <div class="stat-box">
                <div class="stat-number">234</div>
                <div class="stat-label">Total MLAs</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">
                    <span class="status-indicator status-pending"></span>Status
                </div>
                <div class="stat-number" id="statusText" style="font-size: 1.1rem;">Ready</div>
            </div>
        </div>

        <div class="progress-section">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill">0%</div>
            </div>
            <div class="progress-text" id="progressText">Ready to import</div>
        </div>

        <button class="btn-primary" id="importBtn" onclick="startImport()">
            🚀 Start Import Now (All 234 MLAs)
        </button>

        <div class="details">
            <div class="detail-item">
                <span class="detail-label">📋 Data Format:</span>
                <span class="detail-value">JSON (All-MLAs)</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">🗄️ Database:</span>
                <span class="detail-value">Firestore</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">⏱️ Estimated Time:</span>
                <span class="detail-value">2-5 minutes</span>
            </div>
        </div>

        <div id="results" class="results">
            <div class="result-grid">
                <div class="result-card">
                    <div class="result-number" id="successCount">0</div>
                    <div class="result-text">Successfully Imported</div>
                </div>
                <div class="result-card">
                    <div class="result-number" id="errorCount">0</div>
                    <div class="result-text">Failed Records</div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
        import { db } from "./js/firebase-config.js";

        window.startImport = async function() {
            const importBtn = document.getElementById("importBtn");
            const messageDiv = document.getElementById("message");
            const progressFill = document.getElementById("progressFill");
            const progressText = document.getElementById("progressText");
            const statusText = document.getElementById("statusText");
            const resultsDiv = document.getElementById("results");

            importBtn.disabled = true;
            importBtn.innerHTML = '<span class="spinner"></span>Loading MLA data...';

            try {
                // Fetch all-mlas.json
                const response = await fetch('./data/all-mlas.json');
                if (!response.ok) throw new Error('Failed to load MLA data');

                const mlas = await response.json();
                console.log(`Loaded ${mlas.length} MLAs for import`);

                showMessage(`Loading ${mlas.length} MLAs from database...`, 'info');
                importBtn.innerHTML = '<span class="spinner"></span>Importing to Firestore...';
                statusText.textContent = 'Importing...';

                let successCount = 0;
                let errorCount = 0;

                for (let i = 0; i < mlas.length; i++) {
                    try {
                        const mla = mlas[i];

                        // Add to Firestore
                        await addDoc(collection(db, "mlas"), {
                            id: mla.id,
                            name: mla.name,
                            constituency: mla.constituency,
                            district: mla.district,
                            state: mla.state,
                            party: mla.party,
                            email: mla.email,
                            phone: mla.phone,
                            issuesReported: mla.issuesReported || 0,
                            issuesResolved: mla.issuesResolved || 0,
                            score: mla.score || 0,
                            createdAt: serverTimestamp(),
                            updatedAt: serverTimestamp()
                        });

                        successCount++;

                    } catch (error) {
                        errorCount++;
                        console.error(`Error importing MLA ${i + 1}:`, error.message);
                    }

                    // Update progress
                    const progress = Math.round((i + 1) / mlas.length * 100);
                    progressFill.style.width = progress + '%';
                    progressFill.textContent = progress + '%';
                    progressText.textContent = `Importing MLA ${i + 1} of ${mlas.length}...`;
                }

                // Show results
                statusText.textContent = 'Complete ✅';
                resultsDiv.style.display = 'block';
                document.getElementById("successCount").textContent = successCount;
                document.getElementById("errorCount").textContent = errorCount;

                showMessage(`✅ SUCCESS! Imported ${successCount} MLAs to Firestore`, 'success');
                importBtn.innerHTML = '✅ Import Complete!';
                importBtn.disabled = true;

                // Update progress
                progressFill.style.width = '100%';
                progressFill.textContent = '100%';
                progressText.textContent = 'All MLAs successfully imported to Firestore!';

            } catch (error) {
                console.error('Import error:', error);
                showMessage(`❌ Import failed: ${error.message}`, 'error');
                importBtn.disabled = false;
                importBtn.textContent = '🚀 Start Import Now (All 234 MLAs)';
                statusText.textContent = 'Error';
            }
        };

        function showMessage(text, type) {
            const messageDiv = document.getElementById("message");
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
        }

        // Check Firebase config on load
        if (typeof db === 'undefined') {
            showMessage('❌ Firebase not configured. Check js/firebase-config.js', 'error');
            document.getElementById("importBtn").disabled = true;
        }
    </script>
</body>
</html>
